trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: vg-windows-terraform
  - name: terraformVersion
    value: '1.9.8'
  - name: azureServiceConnection
    value: 'Terraform_VM_Devops'
  - name: terraformWorkingDirectory
    value: '$(Build.SourcesDirectory)/terraform'

stages:
  - stage: ValidateAndPlan
    displayName: 'Terraform Validate and Plan'

    jobs:
      - job: TerraformPlan
        displayName: 'Terraform Plan'

        steps:
          - checkout: self

          - task: Bash@3
            displayName: 'Install Terraform'
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                terraform_dir="$(Agent.ToolsDirectory)/terraform/$(terraformVersion)"
                terraform_zip="$(Agent.TempDirectory)/terraform.zip"

                mkdir -p "$terraform_dir"

                echo "Downloading Terraform..."
                curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o "$terraform_zip"

                echo "Extracting Terraform..."
                unzip -q -o "$terraform_zip" -d "$terraform_dir"

                chmod +x "$terraform_dir/terraform"

                echo "Adding Terraform to PATH..."
                export PATH="$terraform_dir:$PATH"
                echo "##vso[task.prependpath]$terraform_dir"

                rm -f "$terraform_zip"

                echo "Verifying Terraform installation..."
                terraform version

          - task: AzureCLI@2
            displayName: 'Terraform Init, Validate and Plan'
            inputs:
              addSpnToEnvironment: true
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(terraformWorkingDirectory)'
              inlineScript: |
                set -euo pipefail

                echo "Configuring Terraform OIDC authentication..."

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                # Identify the Azure DevOps service connection for OIDC
                export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"

                echo "Checking Azure subscription..."
                az account show --query "{name:name,id:id}" -o table

                echo "Initializing Terraform..."
                terraform init -input=false

                echo "Checking Terraform formatting..."
                terraform fmt -check -recursive

                echo "Validating Terraform configuration..."
                terraform validate

                echo "Generating Terraform plan..."
                terraform plan \
                  -input=false \
                  -lock-timeout=5m \
                  -out=tfplan

                echo "Terraform plan generated successfully."

            env:
              TF_VAR_subscription_id: $(TF_VAR_subscription_id)
              TF_VAR_admin_password: $(TF_VAR_admin_password)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan'
            inputs:
              targetPath: '$(terraformWorkingDirectory)/tfplan'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'